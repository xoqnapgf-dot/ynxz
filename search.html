<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>搜索 · 意拟小站</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="search" class="theme-search">

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-zh">意拟小站</span>
      <span class="brand-en">IDEOLOGICAL&nbsp;HUMANS</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="gallery.html">画廊</a>
      <a href="map.html">地图</a>
      <a href="cp.html">CP乱炖</a>
      <a href="forum.html">讨论区</a>
      <a href="search.html" aria-current="page">搜索</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <p class="page-badge reveal">05&nbsp;·&nbsp;SEARCH</p>
      <h1 class="page-title reveal">搜索</h1>
      <p class="page-title-en reveal" style="--d:.08s">SEARCH</p>
      <div class="ornate-divider reveal" style="--d:.16s" aria-hidden="true"><span class="diamond"></span></div>
    </section>

    <!-- 站内搜索 -->
    <section class="search-stage">
      <form class="home-search reveal" style="--d:.2s" id="siteSearchForm" role="search">
        <span class="search-glyph" aria-hidden="true">&#8981;</span>
        <input type="search" name="q" id="siteSearchInput" placeholder="搜索站内内容" aria-label="站内搜索" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>

      <div class="search-scope reveal" style="--d:.26s" aria-label="搜索范围">
        <button type="button" class="scope-chip" data-scope="all" aria-pressed="true">全部</button>
        <button type="button" class="scope-chip" data-scope="cp" aria-pressed="false">CP乱炖</button>
        <button type="button" class="scope-chip" data-scope="forum" aria-pressed="false">讨论区</button>
        <button type="button" class="scope-chip" data-scope="gallery" aria-pressed="false">画廊</button>
      </div>

      <div class="search-results" id="searchResults" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>意拟小站 · IDEOLOGICAL HUMANS</span>
  </footer>

  <script src="js/gallery-data.js?v=12" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/search.js?v=4" defer></script>
</body>
</html>
