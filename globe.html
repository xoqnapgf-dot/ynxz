<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="site-release" content="23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D地球 · 意拟小站</title>
  <link rel="stylesheet" href="css/style.css?v=27" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <meta name="theme-color" content="#0a0a0e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="意拟小站" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="js/theme.js?v=2"></script>
  <link rel="stylesheet" href="css/map-view.css?v=8" />
  <script type="importmap">{"imports":{"three":"./js/vendor/three/three.module.js","three/addons/":"./js/vendor/three/addons/"}}</script>
</head>
<body data-page="map" class="theme-map" data-map-view="globe">
  <header class="site-header">
    <a class="brand" href="index.html?release=23"><span class="brand-zh">意拟小站</span><span class="brand-en">IDEOLOGICAL&nbsp;HUMANS</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="gallery.html?release=23">画廊</a>
      <a href="map.html?release=23" aria-current="page">地图</a>
      <a href="cp.html?release=23">CP乱炖</a>
      <a href="forum.html?release=23">讨论区</a>
      <a href="search.html?release=23">搜索</a>
    </nav>
  </header>

  <main class="map-main atl-main glb-main">
    <h1 class="map-sr-only">Pierteia 3D地球与地点沙盘</h1>
    <div id="globeStage" class="atl-stage glb-stage" role="application" aria-label="Pierteia 3D地球：拖动旋转，滚轮或双指缩放，点击国家或地名查看地点志">
      <canvas id="globeCanvas"></canvas>
      <div id="globeLabels" class="atl-labels"></div>

      <div class="atl-ui atl-top">
        <div class="atl-brand" aria-hidden="true"><b>PIERTEIA</b><small>主世界 · 3D地球</small></div>
        <div class="atl-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="atlasSearch" type="search" placeholder="搜索国家或地点" autocomplete="off" spellcheck="false" role="combobox" aria-label="搜索国家或地点" aria-autocomplete="list" aria-controls="atlasSuggest" aria-expanded="false" />
          <kbd aria-hidden="true">/</kbd>
          <ul id="atlasSuggest" class="atl-suggest" role="listbox" aria-label="搜索建议" hidden></ul>
        </div>
        <nav class="atl-seg" aria-label="地图视图">
          <a id="viewFlat" href="map.html?release=23"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>平面</a>
          <a id="viewGlobe" href="globe.html?release=23" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z"/></svg>3D地球</a>
        </nav>
      </div>

      <div class="atl-ui atl-tools">
        <button id="atlasLayersBtn" type="button" aria-expanded="false" aria-controls="atlasLayers" title="图层"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5" opacity=".55"/></svg><span class="map-sr-only">图层</span></button>
        <div class="atl-zoom">
          <button id="zin" type="button" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="zout" type="button" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
        <button id="zfit" type="button" aria-label="回到全景" title="回到全景"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>

      <div id="atlasLayers" class="atl-ui atl-layers" role="group" aria-label="图层" hidden>
        <p class="atl-layers-h">图层</p>
        <label><input type="checkbox" data-layer="clouds" /><span>云层</span></label>
        <label><input type="checkbox" data-layer="borders" /><span>国界</span></label>
        <label><input type="checkbox" data-layer="labels" /><span>地名</span></label>
        <label><input type="checkbox" data-layer="grid" /><span>经纬网</span></label>
        <label class="sep"><input type="checkbox" data-layer="realSun" /><span>真实昼夜<small>太阳固定在空中，转到夜面能看到灯火</small></span></label>
        <label><input type="checkbox" data-layer="spin" /><span>自动旋转</span></label>
        <label class="sep"><input type="checkbox" data-layer="ghosts" /><span>未设定地区<small>地图生成器划出、尚无设定</small></span></label>
      </div>

      <div class="atl-ui atl-foot" aria-hidden="true"><span id="atlasCoord" class="atl-coord"></span></div>

      <!-- 2.5D 沙盘界面 -->
      <div id="dioHud" class="atl-ui dio-hud" hidden>
        <div class="dio-head">
          <button id="dioBack" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>返回地球</button>
          <div class="dio-title"><b id="dioTitle">—</b><small id="dioSub"></small></div>
          <button id="dioInfo" type="button" title="地点介绍"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="map-sr-only">地点介绍</span></button>
        </div>
        <div class="dio-bottom">
          <div id="dioViews" class="dio-views" role="group" aria-label="镜头"></div>
          <div class="dio-toggles">
            <label><input id="dioWeather" type="checkbox" checked /><span>天气与动态</span></label>
            <label><input id="dioOrbit" type="checkbox" /><span>缓慢环绕</span></label>
          </div>
          <p id="dioNote" class="dio-note"></p>
        </div>
      </div>
      <div id="dioVeil" class="dio-veil" aria-hidden="true"><span id="dioVeilText"></span></div>

      <aside id="atlasCard" class="atl-card" aria-labelledby="acName" data-gallery-data="js/gallery-data.js?v=122" hidden>
        <button id="acGrip" class="atl-grip" type="button" aria-label="展开或收起"></button>
        <div id="acBody" class="atl-body">
          <button id="acClose" class="atl-x" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <header class="atl-card-head">
          <p class="atl-kicker"><span id="acKind"></span><span id="acCoord"></span></p>
          <h2 id="acName">—</h2>
          <nav id="acTrail" class="atl-trail" aria-label="所属层级" hidden></nav>
        </header>
        <figure id="acMedia" class="atl-media" hidden></figure>
        <div id="acDesc" class="atl-desc"></div>
        <section id="acChildren" class="atl-sec" hidden></section>
        <section id="acPeople" class="atl-sec" hidden></section>
        <section id="acScene" class="atl-sec" hidden></section>
        </div>
        <div class="atl-actions">
          <button id="acDio" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l9 5 9-5-9-5z"/><path d="M3 15v-3l9-5 9 5v3"/><path d="M8 10.5 12 8l4 2.5"/></svg>进入3D沙盘</button>
          <button id="acFlat" type="button" class="ghost">平面地图</button>
          <button id="acCopy" type="button" class="ghost icon" title="复制链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="map-sr-only">复制链接</span></button>
        </div>
      </aside>

      <div id="globeLoading" class="glb-loading" data-state="loading" role="status">
        <div class="glb-load-in">
          <div class="glb-orb" aria-hidden="true"></div>
          <h2 id="glbLoadTitle">正在展开 Pierteia</h2>
          <p id="glbLoadText">正在载入地表贴图</p>
          <div class="glb-bar"><i id="glbLoadBar"></i></div>
          <a href="map.html?release=23" class="glb-flat">先看平面地图</a>
        </div>
      </div>
      <div id="atlasToast" class="atl-toast" role="status" hidden></div>
    </div>
    <p id="mapAnnouncement" class="map-sr-only" role="status" aria-live="polite"></p>
  </main>
  <noscript><p class="glb-noscript">3D 地球需要 JavaScript 与 WebGL 2。<a href="map.html">打开平面地图</a></p></noscript>

  <script src="js/map-data.js?v=25"></script>
  <script src="js/locations-data.js?v=27"></script>
  <script src="js/atlas-data.js?v=1"></script>
  <script src="js/place-ui.js?v=3"></script>
  <script src="js/map-view.js?v=12"></script>
  <script type="module" src="js/globe/app.js?v=24"></script>
</body>
</html>
