<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CP乱炖 · 意拟小站</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cp.css?v=3" />
</head>
<body data-page="cp" class="theme-cp">

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-zh">意拟小站</span>
      <span class="brand-en">IDEOLOGICAL&nbsp;HUMANS</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="gallery.html">画廊</a>
      <a href="map.html">地图</a>
      <a href="cp.html" aria-current="page">CP乱炖</a>
      <a href="forum.html">讨论区</a>
      <a href="search.html">搜索</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <p class="page-badge reveal">03&nbsp;·&nbsp;CROSSOVER</p>
      <h1 class="page-title reveal">CP乱炖</h1>
      <p class="page-title-en reveal" style="--d:.08s">CROSSOVER</p>
      <div class="ornate-divider reveal" style="--d:.16s" aria-hidden="true"><span class="diamond"></span></div>
    </section>

    <!-- 工具栏：分类 / 排序 / 投稿 -->
    <div class="cp-toolbar reveal" style="--d:.2s">
      <div class="cp-filter" role="group" aria-label="分类筛选">
        <button type="button" class="cp-chip" data-cp-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="cp-chip" data-cp-filter="image" aria-pressed="false">图</button>
        <button type="button" class="cp-chip" data-cp-filter="text" aria-pressed="false">文</button>
        <button type="button" class="cp-chip" data-cp-filter="mixed" aria-pressed="false">图文</button>
      </div>
      <div class="cp-toolbar-right">
        <div class="cp-sort" role="group" aria-label="排序">
          <button type="button" class="cp-chip ghost" data-cp-sort="new" aria-pressed="true">最新</button>
          <button type="button" class="cp-chip ghost" data-cp-sort="hot" aria-pressed="false">最热</button>
        </div>
        <button type="button" class="cp-submit-btn" id="cpOpenSubmit">投稿</button>
      </div>
    </div>

    <!-- 内容卡片 -->
    <section class="cp-grid" id="cpGrid" aria-label="CP乱炖内容"></section>

    <!-- 空状态 -->
    <div class="void-note" id="cpEmpty" hidden>
      <span class="diamond"></span>
      <span>暂无投稿</span>
    </div>
  </main>

  <footer class="site-footer">
    <span>意拟小站 · IDEOLOGICAL HUMANS</span>
  </footer>

  <!-- 投稿弹层 -->
  <div class="cp-overlay" id="cpSubmitOverlay" hidden>
    <div class="cp-modal" role="dialog" aria-modal="true" aria-labelledby="cpSubmitTitle">
      <button type="button" class="cp-modal-close" data-cp-close aria-label="关闭">&times;</button>
      <h2 class="cp-modal-title" id="cpSubmitTitle">投稿</h2>
      <p class="cp-notice">投稿须知：请在内容编辑<b>完成后再点击上传</b>，防止丢失；上传前建议先在本地另行备份草稿。投稿内容保存在本浏览器中。</p>
      <form id="cpSubmitForm" novalidate>
        <label class="cp-field">
          <span class="cp-label">标题</span>
          <input type="text" name="title" maxlength="50" placeholder="为这篇内容起个标题" required />
        </label>
        <div class="cp-field">
          <span class="cp-label">图片（可多选，可只发图 / 只发文字 / 图文结合）</span>
          <div class="cp-upload" id="cpDropArea" tabindex="0">
            <input type="file" id="cpFileInput" accept="image/*" multiple hidden />
            <span class="cp-upload-hint">点击选择图片，或拖拽到此处</span>
            <div class="cp-thumbs" id="cpThumbs"></div>
          </div>
        </div>
        <label class="cp-field">
          <span class="cp-label">正文</span>
          <textarea name="body" rows="6" placeholder="填写正文内容"></textarea>
        </label>
        <p class="cp-form-error" id="cpFormError" hidden></p>
        <div class="cp-form-actions">
          <button type="button" class="cp-btn ghost" data-cp-close>取消</button>
          <button type="submit" class="cp-btn primary" id="cpSubmitBtn">上传</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 详情弹层 -->
  <div class="cp-overlay" id="cpDetailOverlay" hidden>
    <div class="cp-modal wide" role="dialog" aria-modal="true" aria-labelledby="cpDetailTitle">
      <button type="button" class="cp-modal-close" data-cp-close aria-label="关闭">&times;</button>
      <div id="cpDetailBody"></div>
    </div>
  </div>

  <script src="js/main.js" defer></script>
  <script src="js/cp.js?v=6" defer></script>
</body>
</html>
