<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>地图 · 意拟小站</title>
  <link rel="stylesheet" href="css/style.css?v=27" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <meta name="theme-color" content="#0a0a0e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="意拟小站" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="js/theme.js?v=2"></script>
  <style>
    html, body { overflow: hidden; }
    .map-main { position: fixed; left: 0; right: 0; bottom: 0; top: var(--hh, 64px); max-width: none; padding: 0; height: auto; }
    .map-stage2 { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b1220; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .map-stage2.grabbing { cursor: grabbing; }
    .map-canvas { position: absolute; top: 0; left: 0; }
    .map-base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; image-rendering: auto; }
    .map-base.hide { display: none; }
    .hot-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .hot { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; }
    .hot-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; background: rgba(200, 60, 40, .95); box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.6); }
    .hot-name { font: 600 11px/1.1 var(--serif, serif); color: #fff; text-shadow: 0 1px 3px #000, 0 0 4px #000; white-space: nowrap; letter-spacing: .04em; }
    .hot:hover .hot-dot, .hot.active .hot-dot { background: #ffcf5a; }
    /* 特殊地点标记：紫色菱形，区别于国家红点 */
    .hot.special .hot-dot { width:12px; height:12px; transform: rotate(45deg); border-radius:2px; background:#c9a6ff; border:2px solid #fff; box-shadow:0 0 0 2px rgba(50,18,80,.55), 0 0 12px rgba(180,120,255,.95); }
    .hot.special:hover .hot-dot, .hot.special.active .hot-dot { background:#e6d5ff; }
    .hot.special .hot-name { color:#e6d5ff; }
    /* 时空裂缝：细长、曲折的主裂隙在常灵岛周边分叉；随地图缩放 */
    .rift-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .rift-aura { fill: none; stroke: #8650ff; stroke-width: 36; opacity: .18; filter: url(#riftBlur); }
    .rift-glow { fill: none; stroke: #925cff; stroke-width: 16; opacity: .58; filter: url(#riftBlur); }
    .rift-edge { fill: none; stroke: #c4a0ff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
    .rift-core { fill: none; stroke: #08060e; stroke-width: 5.2; stroke-linecap: round; stroke-linejoin: round; }
    .rift-thread { fill: none; stroke: #f1e7ff; stroke-width: .85; stroke-linecap: round; opacity: .72; }
    .rift-branch-glow { fill: none; stroke: #8852f5; stroke-width: 10; stroke-linecap: round; opacity: .42; filter: url(#riftBlur); }
    .rift-branch-edge { fill: none; stroke: #c6a4ff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; opacity: .86; }
    .rift-branch-core { fill: none; stroke: #090711; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .map-ui { position: absolute; z-index: 6; }
    .map-title { top: 14px; left: 50%; transform: translateX(-50%); font-family: var(--serif, serif); font-weight: 900; letter-spacing: .3em; color: #f3f0e8; text-shadow: 0 2px 8px rgba(0,0,0,.8); font-size: 1.05rem; }
    .map-modes { top: 12px; left: 12px; display: flex; gap: 4px; background: rgba(12,14,22,.72); padding: 4px; border-radius: 10px; border: 1px solid rgba(216,178,90,.25); }
    .map-modes button { border: 0; background: transparent; color: #cfc8b4; font: 600 .82rem/1 var(--serif, serif); letter-spacing: .12em; padding: .5rem .8rem; border-radius: 7px; cursor: pointer; }
    .map-modes button[aria-pressed="true"] { background: rgba(216,178,90,.9); color: #1a140a; }
    .map-zoomctl { top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
    .map-zoomctl button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid rgba(216,178,90,.4); background: rgba(12,14,22,.82); color: #e9e2cf; font-size: 1.15rem; cursor: pointer; }
    .map-zoomctl button:hover { border-color: #d8b25a; color: #fff; }
    .map-zoomlvl { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; font: 600 .78rem/1 var(--serif, serif); letter-spacing: .1em; color: #d8b25a; background: rgba(12,14,22,.7); padding: .4rem .55rem; border-radius: 8px; border: 1px solid rgba(216,178,90,.28); }
    .map-scalebar { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; color: #e9e2cf; font-size: .74rem; letter-spacing: .06em; text-shadow: 0 1px 3px #000; }
    .map-coord { bottom: 46px; left: 50%; transform: translateX(-50%); font: 700 .82rem/1 var(--serif, serif); letter-spacing: .04em; color: #1a140a; background: #d8b25a; padding: .45rem .8rem; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .map-coord[hidden] { display: none; }
    .map-scalebar .bar { height: 6px; border: 1px solid #e9e2cf; border-top: none; margin-bottom: 3px; }
    .nation-card { position: absolute; z-index: 8; right: 16px; top: 60px; width: min(320px, 78vw); background: rgba(16,18,26,.95); border: 1px solid rgba(216,178,90,.35); border-radius: 14px; padding: 1rem 1.1rem; color: #efe9d8; box-shadow: 0 20px 50px -20px #000; display: none; }
    .nation-card.show { display: block; }
    .nation-card h3 { margin: 0; font-family: var(--serif, serif); font-size: 1.25rem; letter-spacing: .06em; color: #f3f0e8; }
    .nation-card .form { display: inline-block; margin: .35rem 0 .6rem; font-size: .72rem; letter-spacing: .12em; color: #d8b25a; border: 1px solid rgba(216,178,90,.4); border-radius: 999px; padding: .12rem .55rem; }
    .nation-card p { margin: 0 0 .8rem; font-size: .86rem; line-height: 1.7; color: #bdb6a4; }
    .nation-card .enter { display: inline-block; border: 0; background: rgba(216,178,90,.9); color: #1a140a; font-weight: 700; letter-spacing: .1em; padding: .5rem .9rem; border-radius: 8px; cursor: pointer; }
    .nation-card .nc-close { position: absolute; top: 6px; right: 10px; border: 0; background: none; color: #8a8474; font-size: 1.2rem; cursor: pointer; }
    /* 已设定 vs 自动生成：只有有角色/归属、写进地点志的才算「存在」；其余是地图生成器的占位，默认隐藏 */
    .map-ghost { top: 58px; left: 12px; border: 1px solid rgba(216,178,90,.35); background: rgba(12,14,22,.72); color: #cfc8b4; font: 600 .74rem/1 var(--serif, serif); letter-spacing: .1em; padding: .5rem .75rem; border-radius: 10px; cursor: pointer; backdrop-filter: blur(6px); }
    .map-ghost[aria-pressed="true"] { color: #1a140a; background: rgba(216,178,90,.9); }
    .hot.ghost { display: none; }
    .show-ghosts .hot.ghost { display: flex; opacity: .75; }
    .hot.ghost .hot-dot { width: 8px; height: 8px; border-width: 1px; background: rgba(214,218,230,.55); box-shadow: none; }
    .hot.ghost .hot-name { font-weight: 400; font-size: 10px; opacity: .8; text-shadow: 0 1px 3px #000; }
    .nation-card .ghost-note { margin-top: .5rem; font-size: .78rem; color: #8a8474; letter-spacing: .06em; }
    @media (max-width: 600px) {
      .map-title { font-size: .82rem; letter-spacing: .2em; top: 10px; }
      .map-modes { top: 8px; left: 8px; }
      .map-modes button { padding: .4rem .55rem; font-size: .72rem; }
      .map-zoomctl { top: 8px; right: 8px; gap: 5px; }
      .map-zoomctl button { width: 34px; height: 34px; font-size: 1.05rem; }
      .hot-name { font-size: 9px; }
      .nation-card { right: 8px; left: 8px; top: auto; bottom: 64px; width: auto; }
      .map-zoomlvl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: 10px; }
      .map-scalebar { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 10px; }
    }
  </style>

</head>
<body data-page="map" class="theme-map">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-zh">意拟小站</span><span class="brand-en">IDEOLOGICAL&nbsp;HUMANS</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="gallery.html">画廊</a>
      <a href="map.html" aria-current="page">地图</a>
      <a href="cp.html">CP乱炖</a>
      <a href="forum.html">讨论区</a>
      <a href="search.html">搜索</a>
    </nav>
  </header>

  <main class="map-main">
    <div class="map-toolbar">
      <h1 class="map-heading">PIERTEIA<small>主世界 · 地图与地点志</small></h1>
      <div class="map-projection" role="group" aria-label="地图视图">
        <button type="button" id="viewFlat" data-projection="flat" aria-pressed="true" aria-controls="mapStage">平面</button>
        <button type="button" id="viewGlobe" data-projection="globe" aria-pressed="false" aria-controls="globeHost">球体</button>
      </div>
      <label class="map-locate" for="mapPlace">定位地点<select id="mapPlace"><option value="">选择国家或地点…</option></select></label>
      <span class="map-help" id="mapHelp">拖动平移 · 滚轮缩放</span>
    </div>
    <div class="map-workspace">
    <section id="globeHost" aria-label="球体地图" hidden>
      <button id="mapRestoreUI" type="button" hidden title="恢复球体界面，不离开当前场景">恢复界面</button>
      <div class="globe-notice" id="globeNotice" data-state="loading" role="status">
        <h2 id="globeNoticeTitle">正在展开球体地图</h2>
        <p id="globeNoticeText">首次打开需要加载高清地形。平面地图随时可用，局部建筑仅在进入场景时加载。</p>
        <div class="notice-actions"><button id="retryGlobe" type="button" hidden>重新加载球体</button><button id="fallbackFlat" type="button">返回平面地图</button></div>
      </div>
    </section>
    <div id="mapStage" class="map-stage2">
      <div id="mapCanvas" class="map-canvas">
        <img id="baseTerrain" class="map-base" src="素材/地图/terrain.png?v=4" alt="地形图">
        <img id="baseNations" class="map-base hide" src="素材/地图/nations.png?v=4" alt="国家划分图">
        <svg id="riftSvg" class="rift-svg" viewBox="0 0 3000 935" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <filter id="riftBlur" x="-100%" y="-30%" width="300%" height="160%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>
          <g>
            <!-- 主裂隙：从海峡北侧蜿蜒向南，细长而不规则；中心落在常灵岛附近 -->
            <path class="rift-aura" d="M1470 405 C1466 420 1460 428 1465 438 L1473 446 C1481 456 1467 465 1462 476 L1457 487 C1452 499 1468 506 1466 518 C1464 529 1457 532 1461 542 L1471 552 C1478 562 1463 570 1465 579 C1466 588 1477 591 1481 600 C1487 612 1467 617 1468 628 L1475 638 C1481 649 1460 656 1463 667 L1472 679 C1479 689 1466 697 1468 706 L1475 718 C1479 727 1465 734 1464 742"/>
            <path class="rift-glow" d="M1470 405 C1466 420 1460 428 1465 438 L1473 446 C1481 456 1467 465 1462 476 L1457 487 C1452 499 1468 506 1466 518 C1464 529 1457 532 1461 542 L1471 552 C1478 562 1463 570 1465 579 C1466 588 1477 591 1481 600 C1487 612 1467 617 1468 628 L1475 638 C1481 649 1460 656 1463 667 L1472 679 C1479 689 1466 697 1468 706 L1475 718 C1479 727 1465 734 1464 742"/>
            <path class="rift-edge" d="M1470 405 C1466 420 1460 428 1465 438 L1473 446 C1481 456 1467 465 1462 476 L1457 487 C1452 499 1468 506 1466 518 C1464 529 1457 532 1461 542 L1471 552 C1478 562 1463 570 1465 579 C1466 588 1477 591 1481 600 C1487 612 1467 617 1468 628 L1475 638 C1481 649 1460 656 1463 667 L1472 679 C1479 689 1466 697 1468 706 L1475 718 C1479 727 1465 734 1464 742"/>
            <path class="rift-core" d="M1470 405 C1466 420 1460 428 1465 438 L1473 446 C1481 456 1467 465 1462 476 L1457 487 C1452 499 1468 506 1466 518 C1464 529 1457 532 1461 542 L1471 552 C1478 562 1463 570 1465 579 C1466 588 1477 591 1481 600 C1487 612 1467 617 1468 628 L1475 638 C1481 649 1460 656 1463 667 L1472 679 C1479 689 1466 697 1468 706 L1475 718 C1479 727 1465 734 1464 742"/>
            <path class="rift-thread" d="M1464 554 L1470 562 M1469 582 L1475 590 M1469 610 L1473 617"/>
            <!-- 裂隙在常灵岛近旁分出几道短枝，像从岛周海面撕开的细裂纹 -->
            <path class="rift-branch-glow" d="M1461 554 C1454 549 1449 542 1440 541 L1432 533 M1477 594 C1486 599 1492 607 1496 617 L1507 625 M1468 610 C1459 615 1453 623 1444 630"/>
            <path class="rift-branch-edge" d="M1461 554 C1454 549 1449 542 1440 541 L1432 533 M1477 594 C1486 599 1492 607 1496 617 L1507 625 M1468 610 C1459 615 1453 623 1444 630"/>
            <path class="rift-branch-core" d="M1461 554 C1454 549 1449 542 1440 541 L1432 533 M1477 594 C1486 599 1492 607 1496 617 L1507 625 M1468 610 C1459 615 1453 623 1444 630"/>
          </g>
        </svg>
      </div>
      <div id="hotLayer" class="hot-layer"></div>

      <div class="map-ui map-title">PIERTEIA · 主世界</div>
      <div class="map-ui map-modes" role="group" aria-label="图层">
        <button type="button" data-mode="terrain" aria-pressed="true">地形</button>
        <button type="button" data-mode="nations" aria-pressed="false">国家/地区</button>
      </div>
      <button id="ghostToggle" type="button" class="map-ui map-ghost" aria-pressed="false" title="地图生成器自动划定、尚无设定的地区">显示未设定地区</button>
      <div class="map-ui map-zoomctl">
        <button id="zin" type="button" aria-label="放大">+</button>
        <button id="zout" type="button" aria-label="缩小">&minus;</button>
        <button id="zfit" type="button" aria-label="复位">&#x2922;</button>
      </div>
      <div class="map-ui map-scalebar"><div class="bar" id="scaleBar"></div><span id="scaleLabel">—</span></div>
      <div class="map-ui map-zoomlvl" id="zoomLvl">100%</div>
      <div class="map-ui map-coord" id="coordReadout" hidden></div>

      <div class="nation-card" id="nationCard" role="region" aria-label="地点详情">
        <button class="nc-close" id="ncClose" aria-label="关闭">&times;</button>
        <h3 id="ncName">—</h3>
        <span class="form" id="ncForm"></span>
        <button id="ncFold" type="button" aria-expanded="false" aria-controls="ncDesc">地点介绍</button><p id="ncDesc">该区域介绍待补充。</p>
        <div class="nation-actions"><button class="enter" id="ncEnter">进入 →</button><button class="globe-locate" id="ncGlobe" type="button">在球体中查看 ↗</button></div>
      </div>
    </div>
    </div>
    <p id="mapAnnouncement" class="map-sr-only" role="status" aria-live="polite"></p>
  </main>

  <script src="js/map-data.js?v=25"></script>
  <script src="js/locations-data.js?v=27"></script>
  <script src="js/map-flat.js?v=2"></script>
  <script src="js/map-view.js?v=6"></script>

</body>
</html>
